[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eon-kernel"
version = "0.1.0"
description = "Sistema operativo autónomo verificable para objetivos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "EON Project" },
]
keywords = ["agent", "autonomous", "kernel", "orchestrator", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-generativeai>=0.8",
]
chroma = [
    "chromadb>=0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
all = [
    "eon-kernel[llm,chroma,dev]",
]

[project.scripts]
eon-console = "eon.console.__main__:main"

[project.urls]
Documentation = "https://github.com/eon/eon-kernel/docs"
Repository = "https://github.com/eon/eon-kernel"

# ─── setuptools ──────────────────────────────────────────────

[tool.setuptools.packages.find]
include = ["eon*"]
exclude = ["eon.tests*", "eon.*.tests*"]

# ─── pytest ──────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["eon"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # ChromaDB internal telemetry uses asyncio.iscoroutinefunction (deprecated in 3.14)
    "ignore:.*'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning",
    "ignore:.*'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:chromadb.*",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: tests that take more than 1 second",
    "integration: tests that require external services",
    "e2e: end-to-end tests",
]

# ─── ruff (linting + formatting) ────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["eon"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B017",   # assert blind exception (common in tests for edge cases)
    "SIM117", # use single with statement (sometimes less readable)
    "UP042",  # (str, Enum) → StrEnum: stylistic, existing code works fine
]

[tool.ruff.lint.per-file-ignores]
"eon/tests/*" = ["B011", "SIM103", "SIM105", "C408", "C401", "F811", "F841"]
"eon/*/tests/*" = ["B011", "SIM103", "SIM105", "C408", "C401", "F811", "F841"]
"eon/coordinator/manager.py" = ["SIM105"]  # intentional best-effort cascade
"eon/objectives/events.py" = ["SIM105"]   # intentional error swallowing in EventBus
"eon/planner/planner.py" = ["B905"]       # zip without strict is intentional here

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ─── mypy (type checking) ───────────────────────────────────

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false          # gradual: start permissive, tighten over time
disallow_incomplete_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
show_error_codes = true
pretty = true
exclude = [
    "eon/tests/",
    "eon/.*/tests/",
]

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.generativeai.*", "pypdf.*"]
ignore_missing_imports = true

# ─── coverage ────────────────────────────────────────────────

[tool.coverage.run]
source = ["eon"]
omit = [
    "eon/tests/*",
    "eon/*/tests/*",
    "eon/**/conftest.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
